    <section class="formulario">
        <form method="POST" action="https://formspree.io/f/mjgalrnb">
            <fieldset class="form">
                <legend class="leg">Visitas</legend>
                <label for="full-name">Nombre:</label>
                <input type="text" id="full-name" name="name" placeholder="Gabz" required size="20">
            </fieldset>
            <fieldset class="form">
                <legend class="leg">Que tal?</legend>
                <label for="Bien">Bien</label>
                <input id="Bien" type="radio" name="Opinión" value="Bien" />
                <label for="Mal">Mal</label>
                <input id="Mal" type="radio" name="Opinión" value="Mal" />
            </fieldset>
            <fieldset class="form">
                <legend class="leg">¿Qué te gustaría ver?</legend>
                <textarea name="sugerencias" id="sugerencias" cols="30" rows="1" placeholder="Dime acá"></textarea>
            </fieldset>
            <fieldset class="form">
                <legend class="leg">¿Que te gustó más?</legend>
                <label for="pro">Proyectos</label>
                <input id="pro" type="checkbox" name="elección" value="Proyectos" />
                <label for="Form">Formulario</label>
                <input id="Form" type="checkbox" name="elección" value="Formulario" />
                <label for="Todo">Todo</label>
                <input id="Todo" type="checkbox" name="elección" value="Todo" />
            </fieldset>
            <button type="submit" class="boton">Subir</button>
            <div class="g-recaptcha" data-sitekey="6LcWapAsAAAAAIqMoM8z6obGqP0jUaDvjZ3musy2"></div>
        </form>
    </section>
    <footer class="footer">&copy; 2026-Gabriel Olaya</footer>
